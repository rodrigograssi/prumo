<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prumo - Pesquisas de Alinhamento</title>
    <meta name="description" content="Sistema completo para criação e aplicação de pesquisas com visualização em gráficos radar comparativos." />
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css?v=1.0.1" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#594ae2" />
    <meta name="msapplication-TileColor" content="#594ae2" />
    <meta name="msapplication-TileImage" content="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prumo" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- Icons para diferentes dispositivos -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    
    <link href="BlazorSurveyApp.styles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="app">
        <div style="position:absolute; top:30vh; width:100%; text-align:center">
            <h5>Carregando...</h5>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro não tratado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/chartInterop.js?v=1.0.1"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('[PWA] Service Worker registrado com sucesso:', registration.scope);
                        
                        // Verificar se há atualizações
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Há uma nova versão disponível
                                    // Para desenvolvimento: atualizar automaticamente
                                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                                        console.log('[PWA] Atualizando automaticamente (modo desenvolvimento)...');
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    } else if (confirm('Uma nova versão do Prumo está disponível. Deseja atualizar?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('[PWA] Falha ao registrar Service Worker:', error);
                    });
            });

            // Detectar quando o service worker está controlando a página
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });
        }

        // Detectar mudanças no status online/offline
        window.addEventListener('online', () => {
            console.log('[PWA] Aplicação está online');
            document.body.classList.remove('offline');
        });

        window.addEventListener('offline', () => {
            console.log('[PWA] Aplicação está offline');
            document.body.classList.add('offline');
        });

        // Prevenir instalação automática e mostrar prompt personalizado
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Mostrar botão de instalação personalizado se necessário
            console.log('[PWA] Aplicação pode ser instalada');
        });

        // Detectar quando o app foi instalado
        window.addEventListener('appinstalled', () => {
            console.log('[PWA] Prumo foi instalado com sucesso!');
            deferredPrompt = null;
        });
    </script>
</body>

</html>
