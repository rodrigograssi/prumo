<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PesquisaX - Offline</title>
    <link href="css/app.css" rel="stylesheet" />
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #594ae2, #7b68ee);
            color: white;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .offline-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .offline-message {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🔌</div>
        <h1 class="offline-title">Você está offline</h1>
        <p class="offline-message">
            Não foi possível conectar à internet.<br>
            Verifique sua conexão e tente novamente.
        </p>
        <button class="retry-button" onclick="window.location.reload()">
            🔄 Tentar Novamente
        </button>
    </div>

    <script>
        // Verificar se volta online
        window.addEventListener('online', () => {
            window.location.reload();
        });
        
        // Atualizar status da conexão
        function updateOnlineStatus() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        
        // Verificar periodicamente se voltou online
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
