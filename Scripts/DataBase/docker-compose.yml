version: '3.8'

services:
  prumo-db:
    build: .
    container_name: prumo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=prumo
      - POSTGRES_USER=prumo_user
      - POSTGRES_PASSWORD=prumo_2024!
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - prumo_data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
    networks:
      - prumo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prumo_user -d prumo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  prumo_data:
    driver: local

networks:
  prumo-network:
    driver: bridge